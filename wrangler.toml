name = "ahke-stock"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The Worker runs first on every request, so it can check the session before
# any page is served. Static files come from ./public through the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ahke-stock"
# Production database (account e8ff99a9f8c199d4e9da1aed8acc4b6c, region WEUR).
database_id = "034d92aa-0c1c-4eba-97d5-be7f5a13e07d"
migrations_dir = "migrations"
